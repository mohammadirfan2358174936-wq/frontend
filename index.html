<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/eventforge-mark.svg" />
    <title>Eventforge — Find your people. Make a night of it.</title>
    <meta
      name="description"
      content="Eventforge is a place to discover events, bring people together and make unforgettable experiences."
    />
    <meta name="author" content="Eventforge" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eventforge" />
    <meta property="og:title" content="Eventforge — Find your people. Make a night of it." />
    <meta
      property="og:description"
      content="A next-generation event management platform with immersive 3D experiences."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect early so text paints without a swap flash -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Inline theme bootstrap: hydrate the persisted theme + reduced-motion
         preference before first paint to avoid a flash of light theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("eventora-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #fff; font-family: sans-serif; padding: 2rem">
        Eventforge requires JavaScript to run. Please enable it to continue.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
